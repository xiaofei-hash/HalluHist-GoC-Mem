[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goc-mem"
version = "0.1.0"
description = "Graph-of-Claims memory control and the HalluHist benchmark"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["goc_mem*"]

[tool.setuptools.package-data]
goc_mem = ["prompt_templates/*.txt"]
